[package]
name = "codex-guard"
version = "0.2.0"
description = "Windows Codex startup health diagnostics"
authors = ["Codex Guard contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "codex_guard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.61.3", features = [
  "ApplicationModel", "Management_Deployment", "Storage", "Storage_Search",
  "Win32_System_WinRT", "Win32_Storage_FileSystem", "Win32_Globalization",
  "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_Security",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Com",
  "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_RemoteDesktop", "Win32_System_Registry"
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
